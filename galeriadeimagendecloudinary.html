<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes Cloudinary - Zenith UI</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0a0e17',
                            card: '#121824',
                            border: '#1f293d',
                            neonCyan: '#00f3ff',
                            neonGreen: '#39ff14',
                            neonPink: '#ff007f'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="galeriadeimagendecloudinary.css">
</head>
<body class="bg-cyber-dark text-white min-h-screen font-sans antialiased">

    <!-- Header Navigation -->
    <header class="border-b border-cyber-border bg-cyber-card/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-cyber-neonCyan/10 border border-cyber-neonCyan flex items-center justify-center text-cyber-neonCyan text-xl shadow-lg">
                    <i class="fa-solid fa-images"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white tracking-wide">Galería Cloudinary</h1>
                    <p class="text-[10px] text-cyber-neonCyan font-mono">Gestor de Comprobantes & Media</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openUploadModal()" class="px-4 py-2 rounded-xl bg-cyber-neonCyan text-black font-bold text-xs uppercase tracking-wider hover:opacity-90 transition-all flex items-center space-x-2 shadow-lg">
                    <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                    <span>Subir Imagen</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">

        <!-- Controls Bar -->
        <div class="bg-cyber-card p-4 rounded-2xl border border-cyber-border flex flex-col sm:flex-row items-center justify-between gap-4">
            <!-- Search Bar -->
            <div class="relative w-full sm:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="gallery-search" placeholder="Buscar por nombre..." class="w-full bg-cyber-dark border border-cyber-border rounded-xl pl-9 pr-4 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-cyber-neonCyan transition-all">
            </div>

            <!-- Stats & Reload -->
            <div class="flex items-center space-x-4 w-full sm:w-auto justify-between sm:justify-end">
                <span class="text-xs text-gray-400 font-mono">Total: <strong id="total-count" class="text-cyber-neonCyan">0</strong> imágenes</span>
                <button onclick="loadGalleryImages()" class="px-3 py-2 rounded-xl bg-cyber-dark border border-cyber-border text-gray-300 hover:text-cyber-neonCyan text-xs transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span>Actualizar</span>
                </button>
            </div>
        </div>

        <!-- Gallery Grid -->
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Render dinámico desde JS -->
        </div>

    </main>

    <!-- Modal de Subida de Imagen -->
    <div id="upload-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-cyber-card border border-cyber-border rounded-2xl w-full max-w-md p-6 space-y-5 shadow-2xl relative">
            <div class="flex items-center justify-between border-b border-cyber-border pb-3">
                <h3 class="font-bold text-white text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-up text-cyber-neonCyan"></i>
                    <span>Subir Comprobante a Cloudinary</span>
                </h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-white transition-all">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-4">
                <!-- Dropzone Input -->
                <div id="dropzone" onclick="document.getElementById('file-input').click()" class="border-2 border-dashed border-cyber-border hover:border-cyber-neonCyan rounded-xl p-8 text-center cursor-pointer transition-all bg-cyber-dark/40 hover:bg-cyber-dark/80 group">
                    <i class="fa-solid fa-image text-3xl text-gray-500 group-hover:text-cyber-neonCyan transition-all mb-2"></i>
                    <p class="text-xs text-gray-300 font-medium">Haz clic o arrastra una imagen aquí</p>
                    <p class="text-[10px] text-gray-500 mt-1">Soporta PNG, JPG, WEBP (Max 5MB)</p>
                    <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                </div>

                <!-- Preview Area -->
                <div id="preview-container" class="hidden space-y-2">
                    <p class="text-[11px] text-cyber-neonCyan font-bold">Vista previa:</p>
                    <img id="image-preview" class="w-full h-40 object-cover rounded-xl border border-cyber-border">
                </div>
            </div>

            <div class="flex items-center space-x-3 pt-2 border-t border-cyber-border">
                <button onclick="closeUploadModal()" class="w-1/2 py-2.5 rounded-xl bg-cyber-dark border border-cyber-border text-gray-400 font-bold text-xs hover:text-white transition-all">
                    Cancelar
                </button>
                <button id="btn-submit-upload" onclick="uploadSelectedFile()" disabled class="w-1/2 py-2.5 rounded-xl bg-cyber-neonCyan text-black font-bold text-xs uppercase tracking-wider opacity-50 cursor-not-allowed hover:opacity-90 transition-all flex items-center justify-center space-x-2">
                    <span>Subir Ahora</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Lightbox (Visor Fullscreen) -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4" onclick="closeLightbox()">
        <div class="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute -top-10 right-0 text-white hover:text-cyber-neonCyan text-2xl transition-all">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="lightbox-img" src="" class="max-w-full max-h-[80vh] rounded-2xl border border-cyber-border object-contain shadow-2xl">
            <div class="mt-4 flex items-center space-x-3">
                <a id="lightbox-download-link" href="#" target="_blank" class="px-4 py-2 rounded-xl bg-cyber-dark border border-cyber-border text-cyber-neonCyan font-bold text-xs hover:bg-cyber-neonCyan hover:text-black transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span>Abrir Original</span>
                </a>
                <button onclick="copyLightboxUrl()" class="px-4 py-2 rounded-xl bg-cyber-dark border border-cyber-border text-white font-bold text-xs hover:border-cyber-neonCyan transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-copy"></i>
                    <span>Copiar Enlace</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-box" class="fixed bottom-5 right-5 z-50 transform translate-y-32 opacity-0 transition-all duration-300">
        <div class="bg-cyber-card border border-cyber-neonCyan px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3">
            <i id="toast-icon" class="fa-solid fa-circle-check text-cyber-neonCyan"></i>
            <div>
                <h5 id="toast-title" class="font-bold text-white text-xs">Notificación</h5>
                <p id="toast-msg" class="text-[11px] text-gray-400">Mensaje de prueba</p>
            </div>
        </div>
    </div>

    <script src="galeriadeimagendecloudinary.js"></script>
</body>
</html>
